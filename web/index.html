<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f4f5f8">
<script>
  // The stored appearance choice, applied before the first paint so the studio
  // never flashes the wrong theme. Deliberately duplicates the small part of
  // web/js/theme.js that cannot wait for a module to load; that file owns the
  // setting itself, including this key and the light default.
  (function () {
    try {
      var preference = localStorage.getItem('shirt-designs.theme') || 'light';
      var dark =
        preference === 'dark' ||
        (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (err) {
      document.documentElement.dataset.theme = 'light';
    }
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shirt Designs">
<meta name="description" content="Design shirts, cut out artwork, set type in any Google Font and send print-ready files to your vendor.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="stylesheet" href="/css/app.css">
<title>Shirt Designs</title>
</head>
<body>
  <div id="app" class="app">
    <div class="boot">
      <div class="boot-mark"></div>
      <p>Starting the studio…</p>
    </div>
  </div>

  <nav id="tabbar" class="tabbar" hidden></nav>
  <div id="sheet-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
